[project]
name = "searchxng_scraper"
version = "0.3.0"
description = "Browserless SearXNG meta-search: importable library + CLI that races public instances and solves Anubis/Portico proof-of-work on CPU"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "badmintonthegoldrush" }]
keywords = [
    "searxng",
    "metasearch",
    "search",
    "scraper",
    "anubis",
    "portico",
    "proof-of-work",
    "bot-detection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "curl_cffi>=0.16",
    "argon2-cffi>=25.1",  # only for the rare argon2id Anubis challenge
]

[project.urls]
Repository = "https://github.com/bddndndncnrhfjfjnf-droid/searchxng_scraper"
Issues = "https://github.com/bddndndncnrhfjfjnf-droid/searchxng_scraper/issues"

# Installed console script: sxng --input "nasa cosmos"
[project.scripts]
sxng = "searxng_scraper.cli:main"

[tool.setuptools]
# The engine is a package: config -> pow -> limiter/anubis -> instances ->
# race -> api -> cli. main.py and searxng_search.py stay as thin shims so
# `python main.py` and `import searxng_search` keep working.
packages = ["searxng_scraper"]
py-modules = ["main", "searxng_search"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"